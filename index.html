<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDex</title>

    <link rel="icon" type="image/x-icon" href="./assets/icons/pokeball.png">

    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/dialog.css">
    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/footer.css">
    <link rel="stylesheet" href="./styles/loading.css">
    <link rel="stylesheet" href="./styles/media.css">

    <script src="./scripts/template.js"></script>
    <script src="./scripts/script.js"></script>

</head>

<body onload="init()">
    <div id="loadingOverlay" class="loading_overlay hidden">
        <img src="./assets/icons/pokeball.png" alt="Lädt..." class="loading_spinner">
    </div>

    <header data-id="header">
        <a class="header_logo" href="./index.html"><img src="./assets/icons/pokemon_logo_sw.png" alt="Pokemon Logo"></a>
        <h1 class="site_title">Pokédex</h1>
        <div class="search_container">
            <input data-id="search-input" id="searchInput" type="text" placeholder="Search Pokemon..."
                onkeydown="handleSearchKeydown(event)" oninput="handleSearchInput()">
            <button type="button" class="searchBtn" data-id="search-button" onclick="searchPokemon()" 
                aria-label="Pokémon suchen">Search</button>
        </div>
    </header>

    <main data-id="content">
        <section class="pokedex_grid" id="pokedexGrid"></section>
        <button data-id="load-more-button" type="button" class="loadMoreBtn" id="loadMoreBtn" onclick="loadMorePokemon()" aria-label="Weitere Pokémon laden">
            Load more
        </button>
    </main>

    <dialog data-id="dialog" id="pokemonDialog" class="pokemon_dialog" onclick="handleDialogClick(event)" aria-labelledby="pokemonDialogTitle">
        <div data-id="overlay-pokemon-name" id="pokemonDialogContent"></div>
        <button data-id="close-dialog-button" type="button" class="dialogCloseBtn" onclick="closePokemonDialog()" aria-label="Dialog schließen">✕</button>
        <div class="dialog_nav">
            <button data-id="prev-button" type="button" class="dialogNavBtn" id="prevPokemonBtn" onclick="showPreviousPokemon()"
                aria-label="Vorheriges Pokémon">←</button>
            <button data-id="next-button" type="button" class="dialogNavBtn" id="nextPokemonBtn" onclick="showNextPokemon()"
                aria-label="Nächstes Pokemon">→</button>
        </div>
    </dialog>

    <footer data-id="footer">
        <a class="footer_logo" href="./index.html"><img src="./assets/icons/pokemon_logo_sw.png" alt="Pokemon Logo"></a>
        <nav class="footer_links" aria-label="Legal Links">
            <a href="./imprint.html">Imprint</a>
            <a href="./privacy_policy.html">Privacy Policy</a>
        </nav>
    </footer>
</body>

</html>
